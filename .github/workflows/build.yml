name: Build PyInstaller Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libgl1-mesa-glx

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller -r requirements.txt

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller `
          --noconfirm `
          --onedir `
          --windowed `
          --name="PWMGR" `
          --icon="SOURCE/icon.ico" `
          --add-data "SOURCE/icon.png;SOURCE" `
          --distpath=dist `
          SOURCE/main.py

    - name: Build Executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller \
          --noconfirm \
          --onedir \
          --windowed \
          --name="PWMGR" \
          --add-data "SOURCE/icon.png:SOURCE" \
          --distpath=dist \
          SOURCE/main.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PWMGR-${{ runner.os }}-build
        path: dist/PWMGR/
