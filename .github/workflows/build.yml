name: Build Nuitka Executable

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build Executable with Nuitka
      run: |
        python -m nuitka `
          --standalone `
          --windows-console-mode=disable `
          --assume-yes-for-downloads `
          --enable-plugin=pyqt6 `
          --windows-icon-from-ico=SOURCE/icon.ico `
          --include-data-files=SOURCE/icon.png=SOURCE/icon.png `
          --output-filename=PWMGR.exe `
          --output-dir=dist `
          SOURCE/main.py

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: PWMGR-windows-build
        path: dist/main.dist/
